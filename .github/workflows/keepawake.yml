name: keepawake
# Keeps the AGRI QUIZ exam runner (Render free instance) awake: free web services sleep after
# 15 minutes without traffic, so this pings it every 5 minutes. Public repo => Actions minutes are
# free/unlimited, so this costs nothing. Change RUNNER_URL if the service is renamed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/keepawake.yml"]
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER_URL: https://live-test-8wu1.onrender.com
    steps:
      - name: ping /ping and read the status page
        run: |
          set -u
          code=$(curl -s -o /tmp/ping.txt -w '%{http_code}' --max-time 90 "$RUNNER_URL/ping" || echo 000)
          echo "GET $RUNNER_URL/ping -> $code : $(head -c 40 /tmp/ping.txt 2>/dev/null)"
          curl -s --max-time 90 "$RUNNER_URL/" -o /tmp/status.json || true
          python3 - <<'PY' || true
          import json
          d = json.load(open("/tmp/status.json"))
          print("runner started:", d.get("started"), "| cycles:", d.get("cycles"))
          print("last:", json.dumps(d.get("last") or {}, separators=(",", ":"))[:400])
          print("errors:", d.get("last_error") or "none")
          for s in d.get("next_slots") or []:
              print("next slot: %s in %s min" % (s.get("slot"), s.get("in_minutes")))
          PY
          test "$code" = "200" || echo "::warning title=runner-sleeping::pinger got HTTP $code (cold start or down)"
